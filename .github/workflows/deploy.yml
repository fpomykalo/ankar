name: Deploy to GitHub Pages

# One Pages site, two versions:
#   main -> https://fpomykalo.github.io/ankar/
#   v02  -> https://fpomykalo.github.io/ankar/v02/
# A push to either branch rebuilds both and redeploys the whole site.

on:
  push:
    branches: [main, v02]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: v01
      - uses: actions/checkout@v4
        with:
          ref: v02
          path: v02
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v01 (main)
        working-directory: v01
        run: npm ci && npm run build
        env:
          VITE_BASE: /ankar/
      - name: Build v02
        working-directory: v02
        run: npm ci && npm run build
        env:
          VITE_BASE: /ankar/v02/
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r v01/dist/. site/
          mkdir -p site/v02
          cp -r v02/dist/. site/v02/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
