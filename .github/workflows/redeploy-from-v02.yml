name: Redeploy site from v02 or pages

# A push to v02 or pages re-runs the deploy workflow on main, which builds
# all three branches and publishes /ankar/ (main), /ankar/v02/ (v02) and the
# unlisted /ankar/bzmxkko5/ (pages) together.

on:
  push:
    branches: [v02, pages]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
